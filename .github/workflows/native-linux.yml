name: native-linux

on:
  workflow_dispatch:
  push:
    branches: [port, main, master]
  pull_request:

# Pushes often arrive a few minutes apart; only the newest one's result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14 clang-18 libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl-dev libfreetype-dev libpng-dev
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-${{ matrix.compiler }}
      # Configure downloads and unpacks about a dozen dependencies. Keep the
      # unpacked sources and the stamps that say they are current; the build
      # directories beside them are left out, since ccache covers those.
      - uses: actions/cache@v4
        with:
          path: |
            build/native/_deps/*-src
            build/native/_deps/*-subbuild
          key: deps-linux-${{ hashFiles('CMakeLists.txt', 'extern/aurora/**/CMakeLists.txt', 'extern/aurora/**/*.cmake') }}
      - name: Configure
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          if [ "$COMPILER" = gcc ]; then export CC=gcc-14 CXX=g++-14; else export CC=clang-18 CXX=clang++-18; fi
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAURORA_ENABLE_TESTS=ON -DMP_BUILD_TESTS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build/native -j 4
      - name: Test
        run: ctest --test-dir build/native -L port --output-on-failure
      # ctest only prints a test's output when it fails, so the wss:// evidence
      # - the verified handshake and the rejections - would otherwise never
      # appear in the log. Run it once more directly to record it.
      - name: Show the TLS handshake result
        run: ./build/native/port_ws_tests
      - name: Build FIFO regressions
        run: cmake --build build/native --target gx_fifo_tests -j 4
      - name: Test FIFO regressions
        run: ./build/native/extern/aurora/tests/gx_fifo_tests --gtest_brief=1
